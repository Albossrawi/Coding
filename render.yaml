# One-click deploy: in Render choose New > Blueprint, select this repository and the add-iptv-web-player branch.
services:
  - type: web
    name: iptv-player
    runtime: node
    plan: free
    rootDir: iptv
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: IPTV_PASSWORD
        generateValue: true
